<!doctype html>
<html lang=pt-BR>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Kit Lab</title>
<style>
:root { --bg: #17140f; --panel: #211c15; --line: #3a3126; --text: #eadfca; --dim: #a8987c; --gold: #e2bf6e; --bad: #ff3df0; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, Segoe UI, sans-serif; display: grid; grid-template-columns: 250px 1fr; height: 100vh; overflow: hidden; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; }
h1 { font-size: 15px; margin: 0 0 2px; color: var(--gold); letter-spacing: .04em; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 16px 0 6px; }
.sub { color: var(--dim); font-size: 12px; margin: 0 0 6px; }
button, select { font: inherit; color: var(--text); background: #2c251b; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; cursor: pointer; }
button:hover { border-color: var(--gold); }
button.on { background: #4a3b20; border-color: var(--gold); color: #fff; }
#models button { display: block; width: 100%; text-align: left; margin: 0 0 4px; }
#models button small { color: var(--dim); display: block; font-size: 11px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 4px; }
label { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
input[type=range] { width: 100%; }
main { display: grid; grid-template-rows: 1fr auto; min-width: 0; min-height: 0; }
#panes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; min-height: 0; }
#panes.over { grid-template-columns: 1fr; }
.pane { position: relative; background: #0d0b08; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 0; }
.pane .tag { position: absolute; top: 6px; left: 8px; font-size: 11px; color: var(--dim); background: #000a; padding: 1px 6px; border-radius: 3px; z-index: 2; pointer-events: none; }
.frame { position: relative; aspect-ratio: 4 / 3; max-width: 100%; max-height: 100%; width: 100%; }
canvas, .frame img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
canvas { cursor: grab; }
canvas:active { cursor: grabbing; }
.frame img { object-fit: contain; pointer-events: none; }
#refPane img.missing { display: none; }
#refEmpty { color: var(--dim); position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
#over { opacity: 0; }
#info { border-top: 1px solid var(--line); padding: 6px 12px; font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--dim); white-space: pre-wrap; }
#info b { color: var(--text); font-weight: 600; }
#err { display: none; position: fixed; inset: auto 12px 12px 262px; background: #5a1010; color: #fff; padding: 10px 14px; border-radius: 4px; font: 12px ui-monospace, monospace; white-space: pre-wrap; z-index: 9; }
.legend { font-size: 11px; color: var(--dim); }
.legend i { display: inline-block; width: 10px; height: 10px; background: var(--bad); vertical-align: -1px; margin-right: 4px; }
</style>
</head>
<body>
<aside>
  <h1>Kit Lab</h1>
  <p class=sub>Modelos procedurais × kit original. Ajuste em <code>tools/kitlab/workbench.js</code>; o projeto não muda até aplicar.</p>
  <h2>Modelo</h2>
  <div id=models></div>
  <h2>Vista</h2>
  <div class=grid id=views></div>
  <div class=grid4 id=azs></div>
  <p class=sub style="margin-top:6px">Arraste: girar · botão direito: mover · roda: zoom · <b>F</b>: enquadrar</p>
  <h2>Comparação</h2>
  <label><input type=checkbox id=overlay> Sobrepor a foto do kit</label>
  <label>Opacidade <input type=range id=opacity min=0 max=100 value=50></label>
  <label>Foto <select id=refSel style="flex:1;min-width:0"></select></label>
  <h2>Checagens</h2>
  <label><input type=checkbox id=backs checked> Faces faltando em magenta</label>
  <p class=legend><i></i>interior visível = face ausente ou virada</p>
  <label><input type=checkbox id=wire> Arestas</label>
  <label><input type=checkbox id=ground checked> Chão</label>
  <label>Detalhe <select id=lod><option value=0>LOD 0 (perto)</option><option value=1>LOD 1</option><option value=2>LOD 2 (longe)</option></select></label>
</aside>
<main>
  <div id=panes>
    <div class=pane><span class=tag id=ourTag>Nosso modelo</span><div class=frame><canvas id=c></canvas><img id=over alt=""></div></div>
    <div class=pane id=refPane><span class=tag id=refTag>Kit original</span><div class=frame><img id=ref alt=""><div id=refEmpty></div></div></div>
  </div>
  <div id=info></div>
</main>
<div id=err></div>
<script>
addEventListener('error', (e) => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = e.message + (e.error && e.error.stack ? '\n' + e.error.stack.split('\n').slice(0, 4).join('\n') : ''); });
if (location.protocol.startsWith('http')) { try { new EventSource('/__reload').onmessage = () => location.reload(); } catch {} }
/*SCRIPT*/
</script>
</body>
</html>
